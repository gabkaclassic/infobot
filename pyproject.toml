[project]
name = "infobot"
version = "0.1.0"
description = "Telegram-бот, продающий доступ к дереву материалов через ЮKassa"
requires-python = ">=3.12"

# Только то, что импортируется в коде. Транзитивные зависимости pip разрешает
# сам, lock-файла у проекта нет — точный состав сборки смотрите в артефакте
# pip freeze соответствующего прогона CI.
dependencies = [
    "aiogram==3.10.0",
    "fastapi==0.112.1",
    "pillow==10.4.0",
    "python-dotenv==1.0.1",
    "redis==5.0.8",
    "uvicorn==0.30.6",
    "yookassa==3.3.0",
]

[project.optional-dependencies]
# httpx нужен не напрямую, а fastapi.testclient — он используется в tests/test_webhook.py.
dev = [
    "fakeredis==2.26.1",
    "httpx==0.27.2",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# infobot — приложение, а не библиотека: в site-packages он никогда не ставился,
# Docker кладёт исходники в /app и запускает python main.py. Пустой список
# отключает автопоиск (иначе setuptools упрётся в несколько корневых пакетов),
# и `pip install .` ставит только зависимости — благодаря этому слой с ними
# кэшируется в образе отдельно от исходников.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::SyntaxWarning"]
